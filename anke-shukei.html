<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>白川郷バス旅行 アンケート集計</title>
<style>
  :root{--navy:#1F3864;--amber:#E39A2E;--amber-soft:#FBEBD2;--bg:#F5F6F8;--card:#FFF;--ink:#1B1E24;--muted:#6B7280;--line:#E3E7EE;--good:#2E7D32;--soft:#F2F5FA;}
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  .wrap{max-width:860px;margin:0 auto;padding:0 14px 60px}
  header.app{background:var(--navy);color:#fff;padding:16px;position:sticky;top:0;z-index:20}
  header.app .inner{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
  header.app h1{font-size:18px;margin:0;font-weight:700}
  .btn{padding:10px 16px;border:0;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer}
  .btn.navy{background:var(--navy);color:#fff}.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .btn.light{background:rgba(255,255,255,.15);color:#fff}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0;box-shadow:0 1px 2px rgba(20,30,60,.04)}
  .card h2{font-size:15px;margin:0 0 12px;color:var(--navy)}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .kpi{background:var(--soft);border-radius:12px;padding:14px;text-align:center}
  .kpi .n{font-size:30px;font-weight:800;color:var(--navy);line-height:1.1}.kpi .l{font-size:12px;color:var(--muted);margin-top:4px}
  .bar-row{display:grid;grid-template-columns:140px 1fr 46px;align-items:center;gap:10px;margin:6px 0;font-size:13px}
  .bar{height:16px;background:var(--soft);border-radius:8px;overflow:hidden}.bar>span{display:block;height:100%;background:var(--navy);border-radius:8px}
  .bar.amber>span{background:var(--amber)}
  .pill{display:inline-block;background:var(--amber-soft);color:#8a5a12;border-radius:6px;padding:1px 8px;font-weight:700}
  .freelist{margin:0;padding-left:18px;font-size:14px}.freelist li{margin:4px 0}
  .muted{color:var(--muted);font-size:13px}.empty{color:var(--muted);font-size:14px;padding:10px 0}
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .filters .f{flex:1;min-width:140px}
  select{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;opacity:0;transition:.25s;z-index:60;font-weight:600}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .mask{position:fixed;inset:0;background:rgba(20,30,60,.6);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px}
  .mask.hide{display:none}
  .lockbox{background:#fff;border-radius:14px;padding:24px;max-width:320px;width:100%;text-align:center}
  .lockbox h3{margin:0 0 6px;color:var(--navy);font-size:18px}.lockbox p{margin:0 0 14px;color:var(--muted);font-size:13px}
  .lockbox input{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:9px;text-align:center;font-size:18px;letter-spacing:.3em}
  #app{display:none}
</style>
</head>
<body>

<div class="mask" id="mask">
  <div class="lockbox">
    <h3>🔒 アンケート集計</h3>
    <p>パスワードを入力してください</p>
    <input type="password" id="pw" inputmode="numeric" placeholder="----" onkeydown="if(event.key==='Enter')tryUnlock()">
    <div style="margin-top:14px;display:flex;gap:10px;justify-content:center">
      <button class="btn navy" onclick="tryUnlock()">開く</button>
    </div>
    <div id="pwErr" class="muted" style="color:#B23B3B;margin-top:8px"></div>
  </div>
</div>

<div id="app">
<header class="app"><div class="inner">
  <h1>白川郷バス旅行 アンケート集計</h1>
  <div><button class="btn light" onclick="loadData()">最新を取得</button></div>
</div></header>

<div class="wrap">
  <div class="card">
    <div class="filters">
      <div class="f"><label class="muted">店舗で絞り込み</label><select id="fl_store" onchange="render()"></select></div>
      <div class="f"><label class="muted">参加日で絞り込み</label><select id="fl_date" onchange="render()"></select></div>
      <div><button class="btn ghost" onclick="exportCSV()">CSV書き出し</button></div>
    </div>
    <div class="muted" id="status" style="margin-top:10px">「最新を取得」を押してください。</div>
  </div>

  <div class="card"><h2>サマリー</h2>
    <div class="kpis">
      <div class="kpi"><div class="n" id="k_cnt">0</div><div class="l">回答数</div></div>
      <div class="kpi"><div class="n" id="k_avg">–</div><div class="l">満足度 平均（10点）</div></div>
      <div class="kpi"><div class="n" id="k_again">–</div><div class="l">また参加したい</div></div>
    </div></div>
  <div class="card"><h2>満足度の分布</h2><div id="s_sat"></div></div>
  <div class="card"><h2>良かった点</h2><div id="s_good"></div></div>
  <div class="card"><h2>改善してほしい点</h2><div id="s_improve"></div>
    <h2 style="margin-top:14px;font-size:14px">その他（自由）</h2><ul class="freelist" id="s_improve_free"></ul></div>
  <div class="card"><h2>身体的な負担</h2><div id="s_burden"></div></div>
  <div class="card"><h2>参加のきっかけ</h2><div id="s_motive"></div></div>
  <div class="card"><h2>次に行きたい場所</h2><div id="s_next"></div>
    <h2 style="margin-top:14px;font-size:14px">自由記入（場所）</h2><ul class="freelist" id="s_next_free"></ul></div>
  <div class="card"><h2>ご意見・ご要望</h2><ul class="freelist" id="s_comment"></ul></div>
  <div class="card"><h2>店舗別 回答数・平均満足度</h2><div id="s_store"></div></div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const STORES=["駅西","神宮寺","小立野","新神田","泉野","松任","額","富樫","婦中","立山","本社"];
const DATES=["9/26(土)","10/3(土)","10/5(月)","10/6(火)","10/7(水)","10/8(木)","10/22(木)"];
const GOOD=["景色・自然","食事（昼食）","買い物・お土産","他の方との交流","スタッフの対応","乗り物・移動"];
const IMPROVE=["移動時間が長い","昼食","トイレ休憩（回数・場所）","スケジュール（急ぎ/ゆとり）","費用","特になし"];
const BURDEN=["ちょうどよい","少し疲れた","かなり疲れた"];
const MOTIVE=["スタッフの声かけ","家族の勧め","景色・観光に興味","外出したかった","友人が参加"];
const NEXT=["温泉地","海・水族館","花・庭園","神社仏閣","紅葉・桜など季節の名所","ショッピング"];
const GAS_URL="https://script.google.com/macros/s/AKfycbxOTi1Vwadng62aoJpdgNaiZjEMDIpHAABAPsNiSdo0-DR_xtHDaCjqtFYIn-tK7s0PDQ/exec";
const PASS="6500";
let all=[];

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}
function tryUnlock(){const v=document.getElementById('pw').value.trim();
  if(v===PASS){document.getElementById('mask').classList.add('hide');document.getElementById('app').style.display='block';
    initFilters();loadData()}else{document.getElementById('pwErr').textContent="パスワードが違います"}}
window.addEventListener('load',()=>setTimeout(()=>document.getElementById('pw').focus(),100));

function initFilters(){
  document.getElementById('fl_store').innerHTML='<option value="">全店舗</option>'+STORES.map(s=>`<option>${s}</option>`).join("");
  document.getElementById('fl_date').innerHTML='<option value="">全日程</option>'+DATES.map(d=>`<option>${d}</option>`).join("");
}

function loadData(){
  document.getElementById('status').textContent="取得中…";
  const cb='__cb'+Date.now();
  const timer=setTimeout(()=>{document.getElementById('status').textContent="取得に時間がかかっています。URL・デプロイ設定をご確認ください。"},8000);
  window[cb]=function(arr){clearTimeout(timer);try{delete window[cb]}catch(e){}
    all=Array.isArray(arr)?arr:[];
    document.getElementById('status').textContent="取得完了："+all.length+"件（"+new Date().toLocaleString('ja-JP')+"）";
    render()};
  const s=document.createElement('script');
  s.src=GAS_URL+(GAS_URL.indexOf('?')>=0?'&':'?')+'type=responses&callback='+cb;
  s.onerror=()=>{clearTimeout(timer);document.getElementById('status').textContent="取得に失敗しました。"};
  document.body.appendChild(s);
}

function filtered(){
  const st=document.getElementById('fl_store').value, dt=document.getElementById('fl_date').value;
  return all.filter(r=>(!st||r.store===st)&&(!dt||r.date===dt));
}
function bar(label,val,max,amber){const pct=max?Math.round(val/max*100):0;
  return `<div class="bar-row"><div>${label}</div><div class="bar${amber?' amber':''}"><span style="width:${pct}%"></span></div><div style="text-align:right">${val}</div></div>`}
function esc(s){return(s||'').toString().replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function multiBars(id,opts,field,data){const c={};opts.forEach(o=>c[o]=0);
  data.forEach(r=>(r[field]||[]).forEach(v=>{if(!(v in c))c[v]=0;c[v]++}));const mx=Math.max(1,...Object.values(c));
  document.getElementById(id).innerHTML=Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>bar(k,v,mx)).join('')}

function render(){
  const data=filtered(),n=data.length;
  document.getElementById('k_cnt').textContent=n;
  const avg=n?(data.reduce((s,r)=>s+(+r.sat||0),0)/n):0;document.getElementById('k_avg').textContent=n?avg.toFixed(1):'–';
  const yes=data.filter(r=>r.again==='はい').length;document.getElementById('k_again').textContent=n?Math.round(yes/n*100)+'%':'–';
  const sc=Array(11).fill(0);data.forEach(r=>{const v=+r.sat;if(v>=1&&v<=10)sc[v]++});const smax=Math.max(1,...sc.slice(1));
  document.getElementById('s_sat').innerHTML=[...Array(10)].map((_,i)=>bar((i+1)+'点',sc[i+1],smax,true)).join('');
  multiBars('s_good',GOOD,'good',data);multiBars('s_improve',IMPROVE,'improve',data);multiBars('s_motive',MOTIVE,'motive',data);multiBars('s_next',NEXT,'next',data);
  const bc={};BURDEN.forEach(b=>bc[b]=0);data.forEach(r=>{if(r.burden)bc[r.burden]=(bc[r.burden]||0)+1});const bmax=Math.max(1,...Object.values(bc));
  document.getElementById('s_burden').innerHTML=BURDEN.map(b=>bar(b,bc[b],bmax)).join('');
  const impF=data.filter(r=>r.improveOther).map(r=>`<li>${esc(r.improveOther)}<span class="muted">（${esc(r.store)}）</span></li>`);
  document.getElementById('s_improve_free').innerHTML=impF.join('')||'<li class="muted">なし</li>';
  const nf=data.filter(r=>r.nextOther).map(r=>`<li>${esc(r.nextOther)}<span class="muted">（${esc(r.store)}）</span></li>`);
  document.getElementById('s_next_free').innerHTML=nf.join('')||'<li class="muted">なし</li>';
  const cms=data.filter(r=>r.comment).map(r=>`<li>${esc(r.comment)}<span class="muted">（${esc(r.store)}${r.name?'・'+esc(r.name):''}）</span></li>`);
  document.getElementById('s_comment').innerHTML=cms.join('')||'<li class="muted">なし</li>';
  const stt={};STORES.forEach(s=>stt[s]={n:0,sum:0});
  data.forEach(r=>{if(!stt[r.store])stt[r.store]={n:0,sum:0};stt[r.store].n++;stt[r.store].sum+=(+r.sat||0)});
  const rows=STORES.filter(s=>stt[s]&&stt[s].n>0).map(s=>`<div class="bar-row"><div>${s}</div><div class="muted">回答 ${stt[s].n}件</div><div style="text-align:right"><span class="pill">${(stt[s].sum/stt[s].n).toFixed(1)}</span></div></div>`);
  document.getElementById('s_store').innerHTML=rows.join('')||'<div class="empty">回答がありません。</div>';
}

function exportCSV(){const data=filtered();if(!data.length){toast("回答がありません");return}
  const head=["送信日時","店舗","参加日","氏名","満足度","良かった点","改善してほしい点","改善(自由)","身体的な負担","参加のきっかけ","次行きたい(選択)","次行きたい(自由)","また参加","コメント"];
  const cc=v=>{v=(v==null?'':String(v));return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const lines=[head.join(",")];
  data.forEach(r=>lines.push([r.ts,r.store,r.date,r.name,r.sat,(r.good||[]).join('、'),(r.improve||[]).join('、'),r.improveOther,r.burden,(r.motive||[]).join('、'),(r.next||[]).join('、'),r.nextOther,r.again,r.comment].map(cc).join(",")));
  const blob=new Blob(["\uFEFF"+lines.join("\r\n")],{type:"text/csv"});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download="白川郷アンケート集計_"+new Date().toISOString().slice(0,10)+".csv";a.click();
}
</script>
</body>
</html>
