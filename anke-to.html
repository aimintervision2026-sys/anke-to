<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>白川郷バス旅行 参加者アンケート（入力）</title>
<style>
  :root{--navy:#1F3864;--amber:#E39A2E;--amber-soft:#FBEBD2;--bg:#F5F6F8;--card:#FFF;--ink:#1B1E24;--muted:#6B7280;--line:#E3E7EE;--good:#2E7D32;--soft:#F2F5FA;}
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-text-size-adjust:100%}
  .wrap{max-width:720px;margin:0 auto;padding:0 14px 90px}
  header.app{background:var(--navy);color:#fff;padding:16px;position:sticky;top:0;z-index:20}
  header.app .inner{max-width:720px;margin:0 auto;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;justify-content:space-between}
  header.app h1{font-size:18px;margin:0;font-weight:700}
  header.app .cnt{font-size:12px;color:#cdd7e8}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0;box-shadow:0 1px 2px rgba(20,30,60,.04)}
  .card h2{font-size:15px;margin:0 0 12px;color:var(--navy);display:flex;align-items:center;gap:8px}
  .card h2 .q{background:var(--navy);color:#fff;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 auto}
  label.lb{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
  .row{display:flex;gap:10px;flex-wrap:wrap}.col{flex:1;min-width:150px}
  select,input[type=text],textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink)}
  textarea{min-height:76px;resize:vertical}
  .sat{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
  .sat button{padding:12px 0;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-size:16px;font-weight:700;color:var(--ink);cursor:pointer}
  .sat button.on{background:var(--amber);border-color:var(--amber);color:#fff}
  .sat-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);padding:9px 12px;border-radius:999px;cursor:pointer;font-size:14px;background:#fff;user-select:none}
  .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg button{flex:1;min-width:84px;padding:11px;border:1.5px solid var(--line);background:#fff;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;color:var(--ink)}
  .seg button.on{background:var(--good);border-color:var(--good);color:#fff}
  .btn{padding:12px 18px;border:0;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
  .btn.primary{background:var(--amber);color:#fff}.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .submitbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;z-index:30;box-shadow:0 -2px 8px rgba(20,30,60,.06)}
  .submitbar .inner{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
  .submitbar .btn.primary{flex:1;padding:14px;font-size:16px}
  .toptools{display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap}
  .btn.sm{padding:8px 12px;font-size:13px;border-radius:8px}
  .muted{color:var(--muted);font-size:13px}
  .toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;opacity:0;transition:.25s;z-index:50;font-weight:600}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.ok{background:var(--good)}
  /* print */
  .paper{display:none}
  @media print{body{background:#fff}header.app,.app-only,.submitbar{display:none !important}.wrap{max-width:100%;padding:0}.paper{display:block}.pf{page-break-after:always}@page{size:A4;margin:12mm}}
  .paper .pf{font-size:14px;color:#000}
  .paper h1.pt{font-size:21px;text-align:center;margin:0 0 2px}
  .paper .pnote{text-align:center;font-size:11px;color:#444;margin:0 0 10px}
  .paper .pq{border:1.4px solid #000;border-radius:7px;padding:8px 11px;margin:0 0 8px}
  .paper .pq .pl{font-size:14px;font-weight:700;margin:0 0 6px}
  .paper .pscale{display:flex;gap:6px;flex-wrap:wrap;font-size:16px}
  .paper .pscale .n{width:30px;height:30px;border:1.3px solid #000;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
  .paper .pchips{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}.paper .pchips span::before{content:"□ "}
  .paper .pwrite{border-bottom:1px solid #999;min-height:20px}.paper .pwrite.tall{min-height:40px}
  .paper .prow{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}.paper .prow span::before{content:"○ "}
  .paper .pmeta{display:flex;gap:16px;font-size:13px;margin-top:2px;flex-wrap:wrap}
</style>
</head>
<body>
<header class="app"><div class="inner">
  <h1>白川郷バス旅行 参加者アンケート</h1>
  <span class="cnt">本セッション提出：<b id="sessCnt">0</b>件</span>
</div></header>

<div class="wrap app-only">
  <div class="card">
    <h2>回答者</h2>
    <div class="row">
      <div class="col"><label class="lb">店舗</label><select id="f_store"></select></div>
      <div class="col"><label class="lb">参加日</label><select id="f_date"></select></div>
    </div>
    <div style="margin-top:12px"><label class="lb">お名前（任意・匿名可）</label><input type="text" id="f_name" placeholder="未記入でもOK"></div>
  </div>

  <div class="card"><h2><span class="q">1</span>今回の旅行の満足度（10段階）</h2><div class="sat" id="f_sat"></div><div class="sat-legend"><span>1 とても不満</span><span>10 大満足</span></div></div>
  <div class="card"><h2><span class="q">2</span>良かった点（いくつでも）</h2><div class="chips" id="f_good"></div></div>
  <div class="card"><h2><span class="q">3</span>改善してほしい点（いくつでも）</h2><div class="chips" id="f_improve"></div>
    <div style="margin-top:10px"><label class="lb">その他</label><input type="text" id="f_improve_other" placeholder="具体的にあれば"></div></div>
  <div class="card"><h2><span class="q">4</span>身体的な負担はいかがでしたか？</h2><div class="seg" id="f_burden"></div></div>
  <div class="card"><h2><span class="q">5</span>参加のきっかけ（いくつでも）</h2><div class="chips" id="f_motive"></div></div>
  <div class="card"><h2><span class="q">6</span>次に行きたい場所（いくつでも＋自由）</h2><div class="chips" id="f_next"></div>
    <div style="margin-top:10px"><label class="lb">その他・具体的な場所</label><input type="text" id="f_next_other" placeholder="例：加賀温泉、富山の海 など"></div></div>
  <div class="card"><h2><span class="q">7</span>また参加したいですか？</h2><div class="seg" id="f_again"></div></div>
  <div class="card"><h2><span class="q">8</span>ご意見・ご要望（自由記入）</h2><textarea id="f_comment" placeholder="楽しかったこと、改善してほしいこと など"></textarea></div>

  <div class="toptools">
    <button class="btn sm ghost" onclick="printForm()">紙用紙を印刷</button>
    <button class="btn sm ghost" onclick="backupCSV()">提出済みバックアップCSV</button>
  </div>
</div>

<div class="submitbar"><div class="inner">
  <button class="btn ghost" onclick="resetForm()">クリア</button>
  <button class="btn primary" onclick="submitResponse()">提出する</button>
</div></div>

<div class="wrap paper" id="paperArea"></div>
<div class="toast" id="toast"></div>

<script>
const STORES=["駅西","神宮寺","小立野","新神田","泉野","松任","額","富樫","婦中","立山","本社"];
const DATES=["9/26(土)","10/3(土)","10/5(月)","10/6(火)","10/7(水)","10/8(木)","10/22(木)"];
const GOOD=["景色・自然","食事（昼食）","買い物・お土産","他の方との交流","スタッフの対応","乗り物・移動"];
const IMPROVE=["移動時間が長い","昼食","トイレ休憩（回数・場所）","スケジュール（急ぎ/ゆとり）","費用","特になし"];
const BURDEN=["ちょうどよい","少し疲れた","かなり疲れた"];
const MOTIVE=["スタッフの声かけ","家族の勧め","景色・観光に興味","外出したかった","友人が参加"];
const NEXT=["温泉地","海・水族館","花・庭園","神社仏閣","紅葉・桜など季節の名所","ショッピング"];
const AGAIN=["はい","どちらでも","いいえ"];
// ▼ 送信先（Google Apps Script の /exec）
const GAS_URL="https://script.google.com/macros/s/AKfycbxOTi1Vwadng62aoJpdgNaiZjEMDIpHAABAPsNiSdo0-DR_xtHDaCjqtFYIn-tK7s0PDQ/exec";
const BK="shirakawa_enq_backup";

let cur={sat:null,good:new Set(),improve:new Set(),burden:null,motive:new Set(),next:new Set(),again:null};
let sess=0;

function opt(s,a){s.innerHTML=a.map(v=>`<option>${v}</option>`).join("")}
opt(document.getElementById('f_store'),STORES);opt(document.getElementById('f_date'),DATES);
const satBox=document.getElementById('f_sat');
for(let i=1;i<=10;i++){const b=document.createElement('button');b.textContent=i;
  b.onclick=()=>{cur.sat=i;[...satBox.children].forEach(c=>c.classList.toggle('on',+c.textContent===i))};satBox.appendChild(b)}
function chipSet(id,arr,set){const box=document.getElementById(id);
  arr.forEach(g=>{const c=document.createElement('div');c.className='chip';c.textContent=g;
    c.onclick=()=>{c.classList.toggle('on');set.has(g)?set.delete(g):set.add(g)};box.appendChild(c)})}
chipSet('f_good',GOOD,cur.good);chipSet('f_improve',IMPROVE,cur.improve);chipSet('f_motive',MOTIVE,cur.motive);chipSet('f_next',NEXT,cur.next);
function segSet(id,arr,key){const box=document.getElementById(id);
  arr.forEach(a=>{const b=document.createElement('button');b.textContent=a;
    b.onclick=()=>{cur[key]=a;[...box.children].forEach(c=>c.classList.toggle('on',c.textContent===a))};box.appendChild(b)})}
segSet('f_burden',BURDEN,'burden');segSet('f_again',AGAIN,'again');

function toast(m,ok){const t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(ok?' ok':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='toast',1900)}
function resetForm(){cur={sat:null,good:new Set(),improve:new Set(),burden:null,motive:new Set(),next:new Set(),again:null};
  document.querySelectorAll('.chip.on,.sat button.on,.seg button.on').forEach(c=>c.classList.remove('on'));
  ['f_name','f_improve_other','f_next_other','f_comment'].forEach(id=>document.getElementById(id).value="");
  window.scrollTo({top:0,behavior:'smooth'})}

function submitResponse(){
  if(cur.sat===null){toast("満足度を選んでください");return}
  const rec={id:'r'+Date.now()+Math.random().toString(36).slice(2,6),
    store:document.getElementById('f_store').value,date:document.getElementById('f_date').value,
    name:document.getElementById('f_name').value.trim(),sat:cur.sat,
    good:[...cur.good],improve:[...cur.improve],improveOther:document.getElementById('f_improve_other').value.trim(),
    burden:cur.burden||"",motive:[...cur.motive],next:[...cur.next],nextOther:document.getElementById('f_next_other').value.trim(),
    again:cur.again||"",comment:document.getElementById('f_comment').value.trim(),ts:Date.now()};
  // 予備バックアップ（端末）
  try{const b=JSON.parse(localStorage.getItem(BK)||'[]');b.push(rec);localStorage.setItem(BK,JSON.stringify(b))}catch(e){}
  // 都度送信（提出）
  if(GAS_URL){
    fetch(GAS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(rec)}).catch(()=>{});
    toast("提出しました（送信）",true);
  }else{toast("提出しました（端末保存）",true)}
  sess++;document.getElementById('sessCnt').textContent=sess;
  resetForm();
}

function backupCSV(){
  let b=[];try{b=JSON.parse(localStorage.getItem(BK)||'[]')}catch(e){}
  if(!b.length){toast("バックアップがありません");return}
  const head=["id","店舗","参加日","氏名","満足度","良かった点","改善してほしい点","改善(自由)","身体的な負担","参加のきっかけ","次行きたい(選択)","次行きたい(自由)","また参加","コメント"];
  const cc=v=>{v=(v==null?'':String(v));return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const lines=[head.join(",")];
  b.forEach(r=>lines.push([r.id,r.store,r.date,r.name,r.sat,(r.good||[]).join('、'),(r.improve||[]).join('、'),r.improveOther,r.burden,(r.motive||[]).join('、'),(r.next||[]).join('、'),r.nextOther,r.again,r.comment].map(cc).join(",")));
  const blob=new Blob(["\uFEFF"+lines.join("\r\n")],{type:"text/csv"});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download="白川郷アンケート_端末控え_"+new Date().toISOString().slice(0,10)+".csv";a.click();
}

function printForm(){let html="";
  for(let k=0;k<2;k++){html+=`<div class="pf">
    <h1 class="pt">白川郷バス旅行 参加者アンケート</h1>
    <p class="pnote">今後の行事の参考にさせていただきます。ご協力をお願いいたします。</p>
    <div class="pmeta">店舗：__________　お名前：__________（任意）　参加日：__/__</div>
    <div class="pq"><div class="pl">1. 満足度（1〜10に○）　1＝とても不満／10＝大満足</div>
      <div class="pscale">${[...Array(10)].map((_,i)=>`<span class="n">${i+1}</span>`).join("")}</div></div>
    <div class="pq"><div class="pl">2. 良かった点（□・いくつでも）</div><div class="pchips">${GOOD.map(g=>`<span>${g}</span>`).join("")}<span>その他（　　　）</span></div></div>
    <div class="pq"><div class="pl">3. 改善してほしい点（□・いくつでも）</div><div class="pchips">${IMPROVE.map(g=>`<span>${g}</span>`).join("")}</div>
      <div style="margin-top:4px">その他：<span class="pwrite" style="display:inline-block;width:65%">&nbsp;</span></div></div>
    <div class="pq"><div class="pl">4. 身体的な負担（○）</div><div class="prow">${BURDEN.map(a=>`<span>${a}</span>`).join("")}</div></div>
    <div class="pq"><div class="pl">5. 参加のきっかけ（□・いくつでも）</div><div class="pchips">${MOTIVE.map(g=>`<span>${g}</span>`).join("")}</div></div>
    <div class="pq"><div class="pl">6. 次に行きたい場所（□・いくつでも／自由）</div><div class="pchips">${NEXT.map(g=>`<span>${g}</span>`).join("")}</div>
      <div style="margin-top:4px">その他：<span class="pwrite" style="display:inline-block;width:65%">&nbsp;</span></div></div>
    <div class="pq"><div class="pl">7. また参加したいですか？（○）</div><div class="prow">${AGAIN.map(a=>`<span>${a}</span>`).join("")}</div></div>
    <div class="pq"><div class="pl">8. ご意見・ご要望</div><div class="pwrite tall">&nbsp;</div><div class="pwrite tall">&nbsp;</div></div>
  </div>`}
  document.getElementById('paperArea').innerHTML=html;window.print()}
</script>
</body>
</html>
